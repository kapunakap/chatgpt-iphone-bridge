name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-device:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix relay
      - run: npm test
      - run: npm run smoke:cellular
      - run: npm run check:relay
      - run: npm run check:package
      - name: Validate Cloudflare relay bundle
        if: matrix.os == 'ubuntu-latest'
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler.log
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --prefix relay -- wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/cellular-relay"
      - name: Build and verify cellular iOS protocol
        if: matrix.os == 'macos-latest'
        run: npm run cellular:ios:check
      - name: Verify reviewed production advisory set
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/check-audit.mjs "$RUNNER_TEMP/npm-audit.json"
      - name: Verify relay has no production advisories
        shell: bash
        run: npm audit --prefix relay --omit=dev
