<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPhone Bridge Test</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
      button, input, a { display: block; margin: 1rem 0; font: inherit; }
      #result { min-height: 1.5rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>iPhone Bridge Test</h1>
      <p id="bridge-ready">BRIDGE_FIXTURE_READY</p>
      <label for="message">Test message</label>
      <input id="message" name="message" autocomplete="off" />
      <button id="confirm" type="button">Confirm</button>
      <p id="result" role="status"></p>
      <a href="/?page=next" id="next-link">Open next state</a>
    </main>
    <script>
      const result = document.querySelector("#result");
      const input = document.querySelector("#message");
      document.querySelector("#confirm").addEventListener("click", () => {
        result.textContent = `CONFIRMED:${input.value}`;
      });
      if (new URL(location.href).searchParams.get("page") === "next") {
        result.textContent = "NEXT_STATE_READY";
      }
    </script>
  </body>
</html>
